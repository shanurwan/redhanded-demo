name: redhanded
on: pull_request
permissions:
  contents: write
  pull-requests: write
  statuses: write
jobs:
  redhanded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shanurwan/redhanded@main
        with:
          repair: "true"
